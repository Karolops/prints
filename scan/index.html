<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#101014">
<title>Tag scan</title>
<style>
  :root { color-scheme: dark; --bg: #101014; --card: #1b1b21; --line: #2c2c34;
          --text: #e6e6e1; --dim: #9a9a94; --accent: #4f9cff; --bad: #ff6b5e; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto;
         padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  button { width: 100%; height: 56px; border: 0; border-radius: 10px; background: var(--accent);
           color: #fff; font: inherit; font-size: 17px; font-weight: 600; }
  button.on { background: var(--card); border: 1px solid var(--accent); color: var(--accent); }
  button:disabled { background: var(--card); color: var(--dim); }
  #msg { margin: 12px 0 0; color: var(--dim); }
  #msg.bad { color: var(--bad); }
  .read { margin-top: 12px; padding: 12px; background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; }
  .read h2 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: var(--dim); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  dt { color: var(--dim); }
  dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <button id="scan">Scan</button>
  <p id="msg"></p>
  <div id="reads"></div>
</main>
<script>
"use strict";
const btn = document.getElementById("scan");
const msg = document.getElementById("msg");
const reads = document.getElementById("reads");
let abort = null;

function say(text, bad) { msg.textContent = text; msg.className = bad ? "bad" : ""; }

if (!("NDEFReader" in window)) {
  btn.disabled = true;
  say(window.isSecureContext
    ? "This browser cannot read NFC. Use Chrome on an Android phone."
    : "NFC needs an https:// address.", true);
}

const hex = (view) => Array.from(new Uint8Array(view.buffer, view.byteOffset, view.byteLength),
                                 (b) => b.toString(16).padStart(2, "0")).join(" ");

function decode(record) {
  const d = record.data;
  if (!d) return "";
  switch (record.recordType) {
    case "url":
    case "absolute-url":
      return new TextDecoder().decode(d);
    case "text":
      return new TextDecoder(record.encoding || "utf-8").decode(d);
    case "mime":
      return /^(text\/|application\/(json|xml))/.test(record.mediaType || "")
        ? new TextDecoder().decode(d) : hex(d);
    default:
      return hex(d);
  }
}

function row(dl, label, value, link) {
  const dt = document.createElement("dt");
  dt.textContent = label;
  const dd = document.createElement("dd");
  if (link && /^https?:\/\//i.test(value)) {
    const a = document.createElement("a");
    a.href = value; a.textContent = value;
    dd.append(a);
  } else {
    dd.textContent = value;
  }
  dl.append(dt, dd);
}

function show(event) {
  const card = document.createElement("section");
  card.className = "read";
  const h = document.createElement("h2");
  h.textContent = new Date().toLocaleTimeString();
  const dl = document.createElement("dl");
  row(dl, "Serial", (event.serialNumber || "?").replace(/:/g, "").toUpperCase());
  const records = event.message.records;
  if (!records.length) row(dl, "Records", "empty tag");
  records.forEach((r, i) => {
    const value = r.recordType === "mime" ? `${r.mediaType}\n${decode(r)}` : decode(r);
    row(dl, `${i + 1}. ${r.recordType}`, value, r.recordType === "url" || r.recordType === "absolute-url");
  });
  card.append(h, dl);
  reads.prepend(card);
  if (navigator.vibrate) navigator.vibrate(60);
}

function stop() {
  if (abort) abort.abort();
  abort = null;
  btn.textContent = "Scan";
  btn.classList.remove("on");
  say("");
}

btn.addEventListener("click", async () => {
  if (abort) { stop(); return; }
  abort = new AbortController();
  try {
    const reader = new NDEFReader();
    reader.onreading = show;
    reader.onreadingerror = () => say("Tag seen but not readable (not NDEF formatted?).", true);
    await reader.scan({ signal: abort.signal });
    btn.textContent = "Stop";
    btn.classList.add("on");
    say("Hold a tag to the back of the phone.");
  } catch (err) {
    abort = null;
    say(err.name === "NotAllowedError" ? "NFC permission refused, or NFC is switched off in Android settings."
      : err.name === "NotReadableError" ? "NFC is switched off or the phone has no NFC."
      : `${err.name}: ${err.message}`, true);
  }
});
</script>
</body>
</html>
